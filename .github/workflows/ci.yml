name: CI

on:
  pull_request:
    paths: ["**.py", "requirements.txt", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["**.py", "requirements.txt", ".github/workflows/ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (syntax errors / undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - run: pytest -q
